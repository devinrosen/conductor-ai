[package]
name = "conductor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Conductor — multi-repo orchestration"

[dependencies]
runkon-flow = { version = "0.8.2-alpha", features = ["sqlite", "diagnostics"] }
runkon-flow-executors = "0.8.2-alpha"
runkon-runtimes = "0.8.2-alpha"
runkon-anthropic = "0.8.2-alpha"
runkon-google = "0.8.2-alpha"
runkon-notify = "0.8.2-alpha"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
toml = "0.8"
dirs = "6"
jsonwebtoken = "9"
ureq = { version = "2", features = ["json"] }
serde_yml = "0.0"
notify = "6"
tracing = "0.1"
libc = "0.2"
tempfile = "3"
rust-embed = { version = "8", features = ["include-exclude"] }
utoipa = { version = "5", optional = true }
ctor = { version = "0.8", optional = true }

[features]
test-helpers = ["dep:ctor"]
openapi = ["dep:utoipa", "runkon-flow/utoipa", "runkon-runtimes/utoipa"]

[dev-dependencies]
conductor-core = { path = ".", features = ["test-helpers"] }
regex-lite = "0.1"
tracing-test = "0.2"
runkon-flow = { version = "0.8.2-alpha", features = ["test-utils"] }
mockito = "0.32"
