fields:
  root_cause: string
  failure_category:
    type: string
    desc: "One of: workflow_bug, agent_bug, infrastructure, schema_error, external_dependency"
  issues:
    type: array
    items:
      title: string
      description: string
      category: string
      failed_step: string
      severity: enum(critical, warning)
      repo?:
        type: string
        desc: "GitHub owner/name to file in when the fix belongs in another repo (only runkon/runkon is accepted); omit for this repo"
  summary: string

markers:
  has_issues: "issues.length > 0"
