# Output contract of .conductor/scripts/aggregate-reviews.sh (the review-aggregator
# script step, #3064). Script steps emit their markers themselves; the markers
# below document how they are derived from these fields.
fields:
  reviewed_by: string
  blocking_findings:
    type: array
    items:
      reviewer: string
      file: string
      line: number
      severity: enum(critical, warning)
      message: string
      also_raised_by?:
        type: array
        desc: "Other reviewers that raised the same problem; the finding counts once"
        items: string
  overall_approved: boolean
  summary: string
  off_diff_findings:
    type: array
    items:
      file: string
      line: number
      severity: enum(critical, warning)
      title: string
      message: string
      reviewer: string
      labels:
        type: array
        items: string
  answered_findings?:
    type: array
    desc: "Findings already answered by a PR reply since the last review; shown but not blocking"
    items:
      reviewer: string
      file: string
      line: number
      severity: enum(critical, warning)
      message: string
      answered_by: string
      reply: string
  decided_findings?:
    type: array
    desc: "Findings that only dispute a decision the user made at the plan gate; shown but not blocking"
    items:
      reviewer: string
      file: string
      line: number
      severity: enum(critical, warning)
      message: string
      decision: number

markers:
  has_review_issues: "overall_approved == false"
  approved: "overall_approved == true"
  has_blocking_findings: "blocking_findings.length > 0"
  has_warnings: "blocking_findings[severity == warning].length > 0"
