name: Release

# Tags release commits and creates a GitHub release.
#
# Triggers:
#   - push to main where the commit subject starts with `release: X.Y.Z` —
#     fires automatically when a `release: X.Y.Z` PR rebase-merges (the
#     rebase keeps the subject as-is, with no `(#NNNN)` suffix).
#   - workflow_dispatch — manual override for back-filling a missed release
#     or re-running against an arbitrary commit (e.g. b1c923b0 for v0.16.0,
#     which merged before this workflow existed).
#
# Notes:
# - Tags are unsigned. Existing manual tags are SSH-signed, but a CI bot
#   doesn't have access to maintainer keys. The commit on main has already
#   been reviewed via the release PR, so tag signing is not load-bearing
#   for provenance here.
# - Release notes are the description of the merged PR that produced the
#   release commit, found via the commits/{sha}/pulls API (works for rebase
#   merges). The Claude Code attribution line is stripped and a Full Changelog
#   link is appended if missing. When no merged PR is found (e.g. a
#   workflow_dispatch on a directly-pushed commit), the release falls back to
#   `gh release create --generate-notes`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.16.0). Leave blank to detect from the target commit subject.'
        required: false
        type: string
      commit:
        description: 'Commit SHA to tag. Leave blank to use the latest main HEAD.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    # Skip the job entirely on non-release pushes so we don't burn an Actions
    # minute on every commit. Manual dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release: ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: Determine version + tag
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            MSG=$(git log -1 --pretty=%s)
            if [[ "$MSG" =~ ^release:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "::error::Commit subject does not match 'release: X.Y.Z': $MSG"
              echo "Provide an explicit version via workflow_dispatch input if this is intentional."
              exit 1
            fi
          fi
          # Validate semver-ish (X.Y.Z, digits only) — keeps tags consistent with `v*` ruleset.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not in X.Y.Z form"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG (version=$VERSION)"

      - name: Verify tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally"
            exit 1
          fi
          # The `v*` ruleset prevents overwriting tags on origin, so a stale
          # remote tag would also reject the push later — fail fast and clearly.
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin"
            exit 1
          fi

      - name: Create + push annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          PR=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty' || true)
          if [ -z "$PR" ]; then
            echo "::notice::No merged PR found for ${SHA}; using generated notes"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr view "$PR" --repo "$REPO" --json body -q .body > notes.raw
          # Drop CRs (web-edited bodies) and the Claude Code attribution line.
          tr -d '\r' < notes.raw | grep -v '^🤖 Generated with' > notes.md || true
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::notice::PR #${PR} has an empty description; using generated notes"
            echo "source=generated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Trim trailing blank lines.
          sed -i -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' notes.md
          # Previous tag by version order, excluding the tag just pushed.
          PREV=$(git tag -l 'v*' | sort -V | awk -v t="$TAG" '$0==t{print p; exit} {p=$0}')
          if ! grep -q '^\*\*Full Changelog\*\*:' notes.md && [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$REPO" "$PREV" "$TAG" >> notes.md
          fi
          echo "source=pr" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
        run: |
          set -euo pipefail
          if [ "$NOTES_SOURCE" = "pr" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
          NOTES_PR: ${{ steps.notes.outputs.pr }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          echo "Tagged and released **$TAG**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $REPO_URL/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $REPO_URL/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NOTES_SOURCE" = "pr" ]; then
            echo "- Notes: from PR #$NOTES_PR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Notes: generated (no associated PR found)" >> "$GITHUB_STEP_SUMMARY"
          fi
