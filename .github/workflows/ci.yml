name: CI

on:
  pull_request:
    branches: [main, "release/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      core: ${{ steps.filter.outputs.core }}
      cli: ${{ steps.filter.outputs.cli }}
      tui: ${{ steps.filter.outputs.tui }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
      desktop: ${{ steps.filter.outputs.desktop }}
      migrations: ${{ steps.filter.outputs.migrations }}
      pipeline_scripts: ${{ steps.filter.outputs.pipeline_scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Must cover every path in the per-crate filters below: the Test
            # job's setup steps (nextest, frontend build) run only when `rust`
            # matches, and its test steps run when a crate filter matches.
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'conductor-core/**'
              - 'conductor-cli/**'
              - 'conductor-tui/**'
              - 'conductor-web/**'
              - 'conductor-desktop/**'
              - 'plugin/**'
              - '.claude-plugin/**'
              - '.github/workflows/ci.yml'
            core:
              - 'conductor-core/**'
              - 'Cargo.lock'
            cli:
              - 'conductor-cli/**'
              - 'plugin/**'
              - '.claude-plugin/**'
              - 'conductor-core/**'
              - 'Cargo.lock'
            tui:
              - 'conductor-tui/**'
              - 'conductor-core/**'
              - 'Cargo.lock'
            web:
              - 'conductor-web/**'
              - 'conductor-core/**'
              - 'Cargo.lock'
            desktop:
              - 'conductor-desktop/**'
            workflows:
              - '.conductor/**'
              - 'conductor-core/templates/**'
              - 'conductor-core/src/workflow/**'
              - 'conductor-cli/src/handlers/workflow.rs'
            migrations:
              - 'conductor-core/src/db/migrations/**'
            pipeline_scripts:
              - '.conductor/scripts/**'
              - '.conductor/tests/**'
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
        if: needs.changes.outputs.rust == 'true'
      - run: cargo fmt --all --check
        if: needs.changes.outputs.rust == 'true'

  clippy:
    name: Clippy
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.desktop == 'true'
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libssl-dev pkg-config
          version: 1.0
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.rust == 'true'
      - run: cd conductor-web/frontend && bun install && bun run build
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2.9.1
        if: needs.changes.outputs.rust == 'true'
      - run: rustup component add clippy
        if: needs.changes.outputs.rust == 'true'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.desktop == 'true'
      - run: cargo clippy --workspace --all-targets --exclude conductor-desktop -- -D warnings
        if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.desktop != 'true'

  test:
    name: Test
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.desktop == 'true'
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libssl-dev pkg-config
          version: 1.0
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.rust == 'true'
      - run: cd conductor-web/frontend && bun install && bun run build
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2.9.1
        if: needs.changes.outputs.rust == 'true'
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
        if: needs.changes.outputs.rust == 'true'
      # One nextest invocation for every changed crate: separate invocations
      # rebuilt conductor-core for each dependent crate (they enable its
      # `test-helpers` feature) and ran the suites one after another (#3222).
      # The crate selection is the same as the old per-crate steps.
      - name: cargo nextest run (changed crates)
        if: needs.changes.outputs.rust == 'true'
        env:
          CORE: ${{ needs.changes.outputs.core }}
          CLI: ${{ needs.changes.outputs.cli }}
          TUI: ${{ needs.changes.outputs.tui }}
          WEB: ${{ needs.changes.outputs.web }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
        run: |
          pkgs=()
          if [ "$CORE" = true ]; then pkgs+=(-p conductor-core); fi
          if [ "$CLI" = true ]; then pkgs+=(-p conductor-cli); fi
          if [ "$TUI" = true ]; then pkgs+=(-p conductor-tui); fi
          if [ "$WEB" = true ]; then
            pkgs+=(-p conductor-web)
            if [ "$DESKTOP" = true ]; then pkgs+=(-p conductor-desktop); fi
          fi
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No crate tests to run for this change set."
            exit 0
          fi
          echo "cargo nextest run ${pkgs[*]}"
          cargo nextest run "${pkgs[@]}"

  validate-workflows:
    name: Validate Workflows
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
        if: needs.changes.outputs.workflows == 'true'
      - name: Validate workflows
        if: needs.changes.outputs.workflows == 'true'
        run: cargo run --bin conductor -- workflow validate --all --templates --path .

  pipeline-scripts:
    name: Pipeline Scripts
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.pipeline_scripts == 'true'
      - name: Install rustfmt
        if: needs.changes.outputs.pipeline_scripts == 'true'
        run: rustup component add rustfmt
      - name: Run pipeline script tests
        if: needs.changes.outputs.pipeline_scripts == 'true'
        run: .conductor/tests/run.sh

  schema-diagram-count:
    name: Schema Diagram Count
    needs: [changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check migration count matches diagram header
        run: |
          MIGRATION_COUNT=$(ls conductor-core/src/db/migrations/*.sql | wc -l | tr -d ' ')
          DIAGRAM_COUNT=$(grep -o '[0-9]* migrations' docs/diagrams/database-schema.mmd | grep -o '[0-9]*')
          if [ "$MIGRATION_COUNT" != "$DIAGRAM_COUNT" ]; then
            echo "database-schema.mmd says $DIAGRAM_COUNT migrations but $MIGRATION_COUNT exist."
            echo "Run: cargo run --bin gen-schema-diagram"
            exit 1
          fi

  schema-diagram-sync:
    name: Schema Diagram Sync
    needs: [changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo run --bin gen-schema-diagram
      - name: Fail if diagram is out of date
        run: |
          git diff --exit-code docs/diagrams/database-schema.mmd || {
            echo "database-schema.mmd is out of date. Run: cargo run --bin gen-schema-diagram"
            exit 1
          }

  # Playwright E2E tests run locally via the pre-push git hook (.githooks/pre-push).
  # See CLAUDE.md for setup: git config core.hooksPath .githooks
